<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Account Switcher</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="panel">
    <!-- Header -->
    <header class="header">
      <div class="title-group">
        <img src="icons/icon-32.png" class="app-icon" alt="icon">
        <h1 class="app-title" data-i18n="title">Tài khoản Google</h1>
      </div>
      <span class="status-badge" id="current-badge" data-i18n="detecting">Đang kiểm tra...</span>
    </header>

    <!-- Configure Number of Accounts -->
    <div class="account-count-bar">
      <label for="account-count-input" class="count-label" data-i18n="accountCountLabel">Số lượng tài khoản:</label>
      <div class="stepper">
        <button type="button" class="stepper-btn" id="dec-count" aria-label="Decrease">−</button>
        <input type="number" id="account-count-input" class="count-input" min="1" max="20" value="4">
        <button type="button" class="stepper-btn" id="inc-count" aria-label="Increase">+</button>
      </div>
    </div>

    <!-- Cycle Next Account Bar -->
    <div class="cycle-bar">
      <button type="button" class="cycle-action-btn" id="cycle-action-btn">
        <svg class="cycle-icon" viewBox="0 0 24 24" width="16" height="16">
          <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0 0 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74A7.93 7.93 0 0 0 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z" fill="currentColor"/>
        </svg>
        <span class="cycle-label" data-i18n="cycleNext">Tài khoản kế tiếp</span>
      </button>
      <button type="button" class="key-badge-btn" id="cycle-key-btn" data-key-index="cycle" data-i18n-title="clickToChange" title="Bấm để đổi phím tắt">
        <kbd class="key-badge" id="cycle-key-badge">Alt+Shift+S</kbd>
      </button>
    </div>

    <!-- Dynamic Account List Section -->
    <section class="section">
      <div class="account-grid" id="account-grid">
        <!-- Rendered dynamically by popup.js -->
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-actions">
        <span class="hint-text" data-i18n="shortcutHint">Bấm vào ô phím tắt để gán bất kỳ phím nào</span>
        <button type="button" class="reset-link" id="reset-shortcuts-btn" data-i18n="resetDefaults">Khôi phục phím gốc</button>
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
