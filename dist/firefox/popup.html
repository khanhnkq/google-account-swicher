<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Account Switcher</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="panel">
    <!-- Header -->
    <header class="header">
      <div class="title-group">
        <img src="icons/icon-32.png" class="app-icon" alt="icon">
        <h1 class="app-title" data-i18n="title">Tài khoản Google</h1>
      </div>
      <span class="status-badge" id="current-badge" data-i18n="detecting">Đang kiểm tra...</span>
    </header>

    <!-- Configure Number of Accounts -->
    <div class="account-count-bar">
      <label for="account-count-input" class="count-label" data-i18n="accountCountLabel">Số lượng tài khoản:</label>
      <div class="stepper">
        <button type="button" class="stepper-btn" id="dec-count" aria-label="Decrease">−</button>
        <input type="number" id="account-count-input" class="count-input" min="1" max="20" value="4">
        <button type="button" class="stepper-btn" id="inc-count" aria-label="Increase">+</button>
      </div>
    </div>

    <!-- Dynamic Account List Section -->
    <section class="section">
      <div class="account-grid" id="account-grid">
        <!-- Rendered dynamically by popup.js -->
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-actions">
        <span class="hint-text" data-i18n="shortcutHint">Bấm vào ô phím tắt để gán bất kỳ phím nào</span>
        <button type="button" class="reset-link" id="reset-shortcuts-btn" data-i18n="resetDefaults">Khôi phục phím gốc</button>
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
